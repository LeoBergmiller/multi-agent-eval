# Frozen seed-task questions — the exact text a task asks.
#
# FROZEN 2026-08-08, BEFORE any reference SQL was written and before any ground truth
# was computed. That order is the entire point.
#
# gate-1a.md §2 step 7: "Reference SQL follows the question; the question must not
# follow the answer." That rule is only checkable if the question was committed first.
# By the time this file was written the messified numbers were already known — 145 vs
# 133 for task 6, 33 vs 32 against 65 vs 25 for task 5, 18+15 vs 33 for task 4 — so
# freezing the text now is what keeps a later edit honest: any change is a dated diff
# against a recorded hash, not an absorbed edit.
#
# TO CHANGE A QUESTION: edit the text, recompute the sha256, and move `frozen_on`.
# `tests/test_frozen_questions.py` fails until all three are done, so it cannot happen
# quietly. **If the rewording is motivated by a number, the task YAML must say so** and
# the original stands as the finding.
#
# These are questions ONLY. No SQL, no ground truth, no expected values — those are
# step 7's, and are human-signed under D17.
#
# Written as an operations analyst would ask: natural language, no SQL vocabulary, and
# no hint of the trap. A question that names its own trap measures nothing, because the
# thing under test is whether the agent looks the definition up unprompted.

frozen_on: 2026-08-08

# AMENDMENTS — every change to a frozen question, with its motivation. The rule is not
# "questions never change"; it is that a change is visible and justified.
amendments:
  - date: 2026-08-08
    task: task5_payer_mix_2025
    from: "What share of our inpatient encounters in 2025 was covered by each payer?"
    to: "What was our payer mix for inpatient care in 2025?"
    motivated_by: >-
      A contradiction against evals/prompt_prohibitions.yaml, NOT by a number. The
      prohibition list withholds `payer_mix_denominator` — encounters vs distinct
      patients vs member-months — while the original question named the denominator
      ("share of our inpatient encounters"), leaving nothing to look up. The two
      artifacts disagreed, and the question was the one that was wrong.
    numbers_unchanged: true
