# What the prompts must not contain — written BEFORE any prompt was, deliberately.
#
# Every seed task measures whether the agent *looks something up* rather than whether it
# already knew it. The prompt sits inside that gap, so anything written into a prompt to
# help the agent succeed is a candidate leak (gate-1a.md §3, tenth instance). The
# `open_stays` rule pasted into `config/agents.yaml` handed over task 2's secondary trap
# before a single run, and read as careful prompt engineering while doing it.
#
# The prompt rewrite is the highest-risk item in step 5 for exactly that reason: a
# good-faith attempt to make the SQL Analyst competent destroys tasks 2, 3, 5 and 6. So
# this list exists first, and "is this a leak?" is a lookup against it rather than a
# judgement call made at the moment of writing, by the person motivated to write it.
#
# SCOPE: every prompt in `config/agents.yaml`, both MCP prompts (`analyst/plan`,
# `analyst/sql_style`), and every MCP **tool description** — the tool docstrings are
# model-facing text and leak identically.
#
# WHAT IS NOT PROHIBITED: schema facts the agent could get from `describe_schema` /
# `describe_table` at the cost of a step — table names, column names, declared types.
# Naming them is a convenience, not a leak, because the value under measurement is the
# *definition*, not the schema. Anything that resolves a definitional ambiguity IS a
# leak, even when it is also true.

tasks:
  - task: task1_org_inpatient_volume_2024
    measures: nothing definitional — the clean control
    withheld: []
    note: >-
      No prohibition of its own. It exists as an uncontaminated floor for
      trajectory_efficiency, which only means something if the other six are traps.

  - task: task2_admissions_2025
    measures: whether the agent looks up what counts as an admission
    withheld:
      - fact: which ENCOUNTERCLASS values count as an admission
        entry: admission
        why: >-
          The whole trap. `encounters` mixes ten classes and only `inpatient` counts;
          counting every row is wrong by more than an order of magnitude and requires no
          SQL mistake at all. A prompt that lists the classes, or says which one to
          filter on, converts this into a typing exercise.
        forbidden:
          - ambulatory
          - wellness
          - urgentcare
          - outpatient
          - hospice
          - encounterclass = 'inpatient'
          - "encounterclass in"
      - fact: that still-admitted encounters (NULL STOP) still count
        entry: open_stays
        why: >-
          Task 2's secondary trap, and the one that was already leaked. An analyst who
          joins on discharge or filters `STOP IS NOT NULL` undercounts by 140.
        forbidden:
          - stop is not null
          - stop is null
          - still admitted
          - still-admitted
          - not been discharged
          - do not filter

  - task: task3_inpatient_los_distribution
    measures: whether the agent looks up how length of stay is counted, and what to drop
    withheld:
      - fact: the LOS counting rule (midnights, same-day = 0, outlier truncation)
        entry: length_of_stay
        why: >-
          Subtracting timestamps is the plausible-wrong answer and looks entirely
          reasonable. Naming the unit resolves the ambiguity the task is built on.
        forbidden:
          - midnight
          - date_diff
          - datediff
          - calendar day
          - same-day discharge
      - fact: that reversed stays (STOP < START) are invalid and excluded, not clamped
        entry: reversed_stays
        why: >-
          35 encounters have negative durations that drag a mean down without erroring.
          Telling the agent to exclude or repair them removes the data-quality half.
        forbidden:
          - stop < start
          - stop >= start
          - negative duration
          - reversed
          - invalid stay

  - task: task4_readmission_by_organization_2025
    measures: whether the agent looks up the readmission definition AND facility identity
    withheld:
      - fact: window anchoring, exclusions, and same- vs any-facility scope
        entry: readmission_30day
        why: >-
          Anchoring on admission rather than discharge produces a lower rate, biased
          non-uniformly, that looks entirely reasonable. Nothing in the output signals it.
        forbidden:
          - anchor
          - index admission
          - index stay
          - 30 days after discharge
          - planned readmission
          - exclude death
      # DEMOTED 2026-08-08 — `attributed_organization` is CONFIRMATORY for task 4, not
      # load-bearing, and is therefore not withheld. The entry is correct and the
      # ambiguity is real (which facility a cross-facility readmission counts against),
      # but only 21 of 545 30-day pairs are cross-organization, and nothing in the
      # agent's observable surface reveals that a choice was made: it attributes to the
      # index facility, never learns there was an alternative, and no `head(5)` shows
      # the 21. The decision is forced; the ambiguity is invisible.
      #
      # Both ways of forcing it were declined on stated grounds: reshaping task 4's
      # question would breach a two-day-old freeze to make a trap work, and reshaping
      # the data would be fitting the warehouse to a sentence. Withholding a fact the
      # agent cannot discover measures nothing — it just fails the task.
      - fact: that one organization changed id mid-2025 and must be unified by name
        entry: organization_identity
        why: >-
          The naive "two busiest organizations" are the two halves of one hospital
          (18 and 15) ahead of the genuine second (12). Mentioning that ids can change,
          or suggesting grouping by name, hands over the entire finding.
        forbidden:
          - changed its id
          - changed id
          - "-old"
          - same organization under two
          - group by name instead

  - task: task5_payer_mix_2025
    measures: over-tooling restraint, plus whether the agent normalises what it sees
    withheld:
      - fact: the payer-mix denominator (encounters, not patients or member-months)
        entry: payer_mix_denominator
        why: Choosing the wrong denominator changes the answer materially.
        forbidden:
          - member-month
          - member month
          - distinct patients
          - per encounter denominator
      - fact: that payer names need trimming/upper-casing before grouping
        entry: payer_name_normalisation
        why: >-
          The naive grouping splits Medicare into 'MEDICARE  ' (33) and 'Medicare' (32)
          against a true 65 — a 19.2% vs 37.8% error on the headline share. Three
          further mangled names are distractors that split nothing, so "which variation
          matters?" is the question. Any instruction to normalise names answers it.
        forbidden:
          - trim(
          - upper(
          - lower(
          - normalise the payer
          - normalize the payer
          - trailing whitespace
          - inconsistent casing
      - fact: that Python is unnecessary here
        entry: null
        why: >-
          `forbidden_tools: [run_python]` measures restraint. A prompt telling the agent
          to prefer SQL over the sandbox pre-empts the choice being measured.
        forbidden:
          - prefer sql over
          - do not use run_python
          - avoid the sandbox

  - task: task6_inpatient_encounters_2023
    measures: whether the agent notices a double-posted feed
    withheld:
      - fact: that encounters are counted distinctly by Id because the feed double-posts
        entry: encounter_deduplication
        why: >-
          The premise is that nothing hints at it — the duplicates are byte-identical,
          there is no primary key to object, and `count(*)` returns 145 against a true
          133. This is the single most fragile trap in the set: one word in a prompt
          ends it.
        forbidden:
          - count(distinct
          - distinct id
          - deduplicat
          - de-duplicat
          - duplicate row
          - double-post
          - the same encounter twice

  - task: task7_same_org_readmission_2025
    measures: distractor-sensitive retrieval — picking the right entry among near-misses
    withheld:
      - fact: which readmission entry applies when the question scopes to one facility
        entry: readmission_30day_same_facility
        why: >-
          The corpus holds several topically near-identical readmission entries. The
          task is decided by retrieval, not SQL, so naming the correct entry — or
          describing what distinguishes them — removes the whole task.
        forbidden:
          - same-facility
          - same facility only
          - any-facility
          - 90-day
          - readmission_30day

# Terms prohibited regardless of task: the doc_ids themselves. Naming an entry tells the
# agent which one to fetch, which is the retrieval decision task 7 measures and a
# shortcut everywhere else.
global_forbidden_doc_ids: true

# --- Tool error messages: IN SCOPE, with one rule ------------------------------------
#
# Verdict rather than an assumption, because the channel turned out to be real.
#
# PERMITTED — schema identifiers. `describe_table`'s rejection lists the allow-listed
# tables; DuckDB's binder offers "Candidate bindings: REVENUE, NAME, ...". Both name
# things `describe_schema` / `describe_table` return anyway, so they are a convenience,
# not a leak, by the same line drawn at the top of this file.
#
# PROHIBITED — row values. Measured, not hypothesised:
#
#     SELECT CAST(NAME AS INTEGER) FROM payers
#     -> Conversion Error: Could not convert string 'Medicare' to INT32
#        when casting from source column NAME
#
# That is a data value in an error string, and it matters twice over. It is a read path
# that returns data outside a `ResultRef`, which §4's critical rule exists to prevent —
# every frame is supposed to travel as a reference. And a handful of deliberate casts
# would enumerate `payers.NAME`, which is exactly where seed task 5's trap lives: an
# agent that surfaced `'MEDICARE  '` this way would have the normalisation defect handed
# to it by an error message rather than found in the data.
#
# ALSO PROHIBITED — internal paths. The same errors echo the artifact store's location
# (`COPY (...) TO '/var/folders/...'`), disclosing the ResultRef mechanism and a
# filesystem path for nothing.
#
# STATUS: enforced from 5.3. `SqlRunner` no longer passes DuckDB's text through; it
# **rebuilds** the message from the error category plus tokens that match a real schema
# identifier, and keeps nothing else.
#
# The plan above said "drop quoted literals and absolute paths", and that plan was wrong
# — measurement against DuckDB 1.5.5 changed it. The same value from the same column
# leaks in three shapes:
#
#     Conversion Error: Could not convert string 'MEDICARE  ' to INT32 ...
#     Conversion Error: invalid date field format: "MEDICARE  ", expected ...
#     Invalid Input Error: Could not parse string "MEDICARE  " according to ...
#     MEDICARE
#     ^
#
# Single-quoted, double-quoted, and **bare on its own line under a caret**. A deny-list
# that strips quoted literals passes its own unit test and leaks the third — and would
# also destroy `Candidate bindings: "Id"`, which this file explicitly permits. So the
# rule is an ALLOW-LIST: nothing of the vendor's free text survives, which holds whatever
# a future DuckDB release decides to put in a message.
#
# Residual, stated rather than hidden: a row value spelled exactly like a table or column
# name survives — as an identifier, which is the permitted category. No such collision
# exists in this warehouse.
#
# Enforced by `tests/test_sql_error_sanitisation.py`, which asserts the OUTCOME: it
# issues deliberate bad casts against `payers.NAME`, reads that column's real values back
# out of the warehouse, and checks the returned error for them — rather than asserting
# that a sanitiser ran.
tool_error_messages:
  in_scope: true
  permitted: schema identifiers (table names, column names, candidate bindings)
  prohibited: row values, internal filesystem paths
  enforced: true  # tests/test_sql_error_sanitisation.py, outcome-shaped

# --- Sandbox output: IN SCOPE, and designed before the sandbox ------------------------
#
# Written at 5.4 BEFORE any sandbox code exists, because instance #15 was a leak on the
# failure path of a tool whose success path was correct, and the fix arrived after the
# tool. `run_python` is the same shape with a far larger payload: it resolves a
# `ResultRef` into a real dataframe INSIDE the container, so a script that fails while
# holding that frame can put actual row data into an exception message. `'MEDICARE  '`
# from a DuckDB cast is one value; a pandas `KeyError` or a `repr()` in a raised message
# can carry many.
#
# THREE CHANNELS, and they need different rules because they have different authors.
#
# 1. stderr / the traceback — AUTHORED BY THE INTERPRETER. The model did not choose this
#    text, so nothing about it is bounded by the model's intent. Strictest rule.
# 2. stdout — AUTHORED BY THE MODEL'S OWN CODE. See below; the rule is a volume cap and
#    the reason is stated rather than assumed.
# 3. the returned artifacts — already `ResultRef`s by construction (§4). No new rule.
#
# --- Rule for the traceback: ALLOW-LIST, reconstructed, same as run_sql ---------------
#
# KEPT:
#   - the exception CLASS (`KeyError`, `ValueError`, `ZeroDivisionError`)
#   - the traceback's frame STRUCTURE: file, line number, function name
#   - the failing SOURCE LINE — this is the model's own code, echoed back. Same argument
#     as `executed_sql` on run_sql: returning someone their own input is not a leak.
#   - container-internal paths (`/sandbox/script.py`, `/inputs/q001.parquet`)
#
# DROPPED:
#   - the exception MESSAGE and args — this is where row data lands
#   - anything rendering a local, including any `repr()` of a frame
#   - host paths (`/Users/...`, `/var/folders/...`) — should never appear given fixed
#     container mount points, and asserted anyway
#   - any path under `runs/` — a `ResultRef` internal, disclosing the mechanism
#
# THE DROPPED MESSAGE IS A REAL COST, RECORDED AS A TRADE RATHER THAN A BARGAIN.
# `NameError: name 'pd' is not defined` is pure signal and losing it makes the agent's
# self-correction harder. The justification is NOT that the cost is small. It is that
# **no statable rule separates a safe message from a leaking one**: the same `KeyError`
# formatting that yields `KeyError: 'nosuchcolumn'` yields `KeyError: 'MEDICARE  '`, and
# the difference is the value, not the shape. A rule that cannot be stated cannot be
# tested, and an untestable rule in this position is the deny-list we already rejected
# once. So the message goes, and the cost is written down instead of argued away.
#
# TO CHECK ONCE THE SANITISER LANDS, and to report as a finding either way: are the
# common failure modes actually self-correctable from class + source line + line number?
# If they are not, that is a finding ABOUT THE TRADE and it gets reported. It is not a
# licence to widen the allow-list quietly.
#
# --- Rule for stdout: a volume cap, and why kind is not checked ------------------------
#
# Decided explicitly, because a byte cap bounds volume and not kind — a truncated frame
# is still a frame, and 50 lines of row data is 50 lines of row data.
#
# The cap is nonetheless the right and sufficient control here, for two reasons that are
# specific rather than general:
#
#   VOLUME IS THE UNIT §4 ACTUALLY MEASURES. The rule "never pass a dataframe through an
#   LLM context" exists to bound context and make `context.bundle_tokens` a measurable
#   per-step metric. A hard byte and line cap delivers exactly that property. Bounding
#   *kind* would serve a different goal than the one §4 states.
#
#   THE MODEL AUTHORED IT, FROM INPUTS IT ALREADY HOLDS. stdout contains what the
#   model's own code chose to print, from frames it explicitly passed as `inputs` and
#   resolved on purpose. It cannot surface data the model was not already entitled to —
#   which is precisely what makes it different from the traceback, where the interpreter
#   chose the content.
#
# AND THE CONTROL FOR *KIND* IS THE MOUNT POLICY, NOT OUTPUT INSPECTION. The real
# question behind "what kind of data can come back" is "what data can be in the container
# at all", and that is answered by `--network none`, a read-only rootfs, and mounting
# only the explicitly-passed `ResultRef` files read-only. A shape check on stdout would
# be a deny-list guessing at what "frame-shaped" means — a CSV-ish blob? a dict repr? —
# which is the form this project rejected for `TableProfile` and for the DuckDB error
# text, and it would fail the same way.
#
# So: no shape check, a stated cap, and an outcome test that a script printing a large
# frame is truncated with an explicit marker — so the bound holds without anything having
# to judge intent.
#
# STATUS: not enforced; `run_python` does not exist yet. This section is the
# specification it will be built against, and `enforced` flips in the same commit as the
# tool, with the outcome test written alongside it rather than after.
sandbox_output:
  in_scope: true
  channels:
    traceback:
      author: the interpreter
      permitted: exception class, frame structure (file, line, function), the failing
        source line, container-internal paths
      prohibited: exception message and args, any rendered local, host paths, runs/ paths
    stdout:
      author: the model's own code
      permitted: anything, up to a hard byte and line cap with a truncation marker
      prohibited: nothing by kind — see the stated argument above
    artifacts:
      author: the model's own code
      permitted: ResultRef only, never a frame
  enforced: false  # run_python does not exist yet; flips with the tool

# --- OPEN DECISION: behavioural leakage -----------------------------------------------
#
# Recorded 2026-08-08, unresolved, for the 5.3 prompt review.
#
# This list withholds **facts**. It has no category for **behaviours**, and the draft
# prompts are full of them: the SQL Analyst is told to query for a distribution rather
# than assume one and that example rows are a sample rather than a summary; the Planner
# is told not to assume the warehouse's shape and to plan for the specialist to inspect
# it. None of that states a definition. All of it instructs the investigative behaviour
# D28 named as the thing being observed — "whether the agent profiles before querying is
# itself the behaviour the trajectory metrics exist to observe."
#
# Neither guard can see it. The denylist matches phrases and there is no phrase; the
# retrieval guard asks whether a text carries a definition's topic, and an instruction
# to go and look carries no definition at all.
#
# THE TRADE-OFF, both directions:
#
#   For including it. Some competence instruction is unavoidable. A prompt that says
#   nothing about how to work measures the base model's habits rather than the system
#   we built, and the eval's subject is the system. D20's single-agent baseline receives
#   the *same* prompts, so the multi-agent-vs-baseline comparison is unaffected either
#   way — whatever competence is instructed is instructed identically in both arms, and
#   that comparison is the headline claim.
#
#   Against. It bounds what any per-task result can be said to show. With these prompts,
#   "the agent investigated the schema unprompted" is **false** — it was prompted. So is
#   "the agent knew not to trust a five-row sample". `trajectory_efficiency` on task 1
#   still measures step count honestly, but the *disposition* producing those steps came
#   from us. Any 1c claim of the form "the agent chose to X" has to become "the agent
#   was instructed to X and did so", which is a materially weaker and much less
#   interesting sentence.
#
# WHAT IS NOT IN DOUBT: this is not the tenth instance. No task's answer is given away,
# and every definitional trap survives intact — an agent told to inspect the schema
# still has to look up what an admission is. The question is what the results license
# us to say, not whether the traps work.
#
# RESOLVED 2026-08-08 at the 5.3 review, BEFORE any prompt was written. The claim
# sentence below is fixed now, while no results exist to be flattered by it — which is
# the whole reason this decision was blocked rather than deferred.
#
# DECISION: interface facts only.
#
#   INSTRUCTED — what a tool returns and what it does not, and what the system requires
#   of an answer. `describe_table` reports shape rather than statistics; example rows
#   are a fixed handful, not a summary; results travel as references, not frames; every
#   claim carries provenance; assumptions are reported rather than dropped. These are
#   the tool contract and the output contract. Withholding them does not make the agent
#   more investigative, it makes it wrong about the interface — the agent would fail on
#   the mechanics of the system rather than on the reasoning under test.
#
#   NOT INSTRUCTED — investigative disposition. No prompt and no tool description tells
#   the agent to inspect the schema before querying, to profile a column rather than
#   assume its contents, to distrust a small sample, or to consult the metrics
#   dictionary before writing SQL. D28 named exactly this as the thing being observed:
#   "whether the agent profiles before querying is itself the behaviour the trajectory
#   metrics exist to observe." An instruction to do it converts the observation into a
#   compliance check.
#
# THE SENTENCE. This is the only wording the README and 1c may use about investigative
# behaviour, and it is quoted rather than paraphrased:
#
#   "Schema inspection, sampling caution, and dictionary lookup are not instructed in
#    any prompt or tool description; where the agent does them, the trajectory records
#    a choice, not compliance."
#
# WHAT IT COSTS, stated because it will show up in the numbers: some runs will be worse
# than they would have been under a prompt that told the agent how to work. That is the
# measurement, not a regression — a lower `task_success` under uninstructed behaviour is
# a finding about the agent, where a higher one under instructed behaviour would have
# been a finding about us.
#
# WHAT IS UNAFFECTED, and was never in doubt: every definitional trap survives intact —
# an agent that decides on its own to inspect the schema still has to look up what an
# admission is. D20's single-agent baseline receives identical prompts either way, so
# the multi-agent-vs-baseline comparison, which is the headline claim, does not move.
#
# UPGRADE PATH, recorded so it is a decision and not an oversight: ship the dispositional
# instruction as a named, versioned `instruction_set` carried in the run record, and
# sweep both arms in 1c. That is strictly more informative than either single choice and
# it is what this decision leaves available — choosing "instructed" today would have
# baked it in, and removing it later would invalidate every run recorded under it.
# TRIGGER: 1c has slack after the baseline arm lands. Not before — it adds a sweep
# dimension that is not in gate-1a.md §2 or in 1c's scope, and "stop at the current gate
# boundary" cuts against building it early.
behavioural_instruction:
  status: resolved
  resolved_on: 2026-08-08
  decision: interface facts only
  instructed: tool contracts (what a tool returns and withholds), output contracts
    (provenance, exact numbers, carried-forward assumptions, scope boundary)
  not_instructed: schema inspection, column profiling, sampling caution, dictionary
    lookup before writing SQL
  claim_sentence: >-
    Schema inspection, sampling caution, and dictionary lookup are not instructed in any
    prompt or tool description; where the agent does them, the trajectory records a
    choice, not compliance.
  affects: 1c claim wording, README phrasing
  not_at_issue: definitional traps (unaffected), D20 baseline comparison (same prompts)
  # Neither automated guard can see this category — see the paragraph above. Recorded as
  # `review` rather than left blank, because an unstated enforcement status reads as
  # enforced, and a rule believed to be checked is worse than one known not to be
  # (gate-1a.md §3, thirteenth instance).
  enforced: review
  upgrade_path:
    what: instruction_set as a named variable in the run record, both arms swept in 1c
    trigger: 1c has slack after the baseline arm lands
