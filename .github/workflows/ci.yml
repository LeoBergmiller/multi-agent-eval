name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # HERMETICITY: this job deliberately has NO `env:` block and NO reference to
    # secrets.ANTHROPIC_API_KEY. That absence is the proof — the suite runs the
    # smoke task in replay mode against committed cassettes, so if a cassette
    # were ever missed the run would raise rather than silently reach the API
    # (architecture.md §6.2, §12). Do not add the key here "just in case": doing
    # so would let a cassette miss turn into a live call and quietly destroy the
    # guarantee this job exists to enforce.
    #
    # Also note: no install of the `rag` extra. CI never needs Project 1.

    steps:
      - uses: actions/checkout@v5

      # No actions/setup-python: `uv sync` reads .python-version (3.12.3) and
      # provisions that interpreter itself, so the runner matches local exactly.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen installs the exact committed resolution. The runner and a clean
      # clone therefore get an identical tree — floors alone would let CI drift
      # onto a different langgraph/mcp than the cassettes were recorded against,
      # and that failure would present as a cassette bug. See D22.
      - name: Install from lockfile
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      # No warehouse build step. `data/load_fixtures.py` was deleted with
      # `data/fixtures/` in bd1d552 (Gate 1a step 2) and this step invoking it was
      # left behind, so every run from 2026-08-06 exited 2 *before* pytest for four
      # days — a red badge that meant "the suite did not run", which is a different
      # state from "a test failed" and indistinguishable from it at a glance.
      #
      # Nothing replaces it: `tests/conftest.py` synthesises every warehouse it needs
      # in-process from `data/synthea_spec.py` (ee67b47), and the tests that want the
      # real `data/warehouse.duckdb` skip when it is absent. Verified against a clean
      # clone with no warehouse, no index and no `[rag]` extra: 214 passed, 45 skipped,
      # 7 xfailed, nothing errored.
      #
      # `tests/test_workflow_paths.py` now asserts that every path named in this file
      # exists, so a refactor cannot delete a script and leave the step calling it.
      - name: Test
        run: uv run pytest
